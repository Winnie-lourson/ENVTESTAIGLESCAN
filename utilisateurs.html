<!DOCTYPE html>
<html>

<head>
    <title>Utilisateurs</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="style-utilisateurs.css">
    <link
        rel="icon"
        type="image/png"
        href="images/ASLOGOV1.png"
    >
</head>

<body>

<div class="btn-accueil">

    <button onclick="window.location.href='accueil.html'">
        <img
            src="images/accueil2-blanc.png"
            class="logo-action"
        >
        <span>Accueil</span>

    </button>

</div>

<h1>UTILISATEURS</h1>

<h2>Gestion des accès et des rôles</h2>

<!-- AJOUT UTILISATEUR -->
<div class="bloc-ajout">

    <input
        type="text"
        id="nom"
        placeholder="Nom"
    >

    <input
        type="text"
        id="login"
        placeholder="Login"
    >

    <input
        type="password"
        id="password"
        placeholder="Mot de passe"
    >

    <select id="role">

        <option value="user">
            Utilisateur
        </option>

        <option value="admin">
            Admin
        </option>

    </select>

    <button onclick="ajouterUtilisateur()">
        <img
            src="images/ajouter-blanc.png"
            class="logo-action"
        >
        <span>Ajouter</span>
        <img
            src="images/entre-blanc.png"
            class="logo-bouton"
        >
    </button>

</div>

<!-- TABLEAU -->
<p id="infos">
    Nombre d'utilisateurs :
    <span id="totalUsers">0</span>
</p>

<div class="table-container">

    <table id="tableUsers">

        <thead>

            <tr>

                <th>Nom</th>

                <th>Login</th>

                <th>Password</th>

                <th>Rôle</th>

                <th>Actions</th>

            </tr>

        </thead>

        <tbody id="usersBody">
        </tbody>

    </table>

</div>

<script type="module">

import { db } from "./firebase-config.js";

import {
    collection,
    getDocs,
    addDoc,
    deleteDoc,
    updateDoc,
    doc,
    query,
    where
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

if (!localStorage.getItem("utilisateur")) { window.location.href = "index.html"; }


// ===============================
// VARIABLES
// ===============================
let body =
    document.getElementById("usersBody");


// ===============================
// SÉCURITÉ ADMIN
// ===============================
async function verifierAdmin() {

    let login =
        localStorage.getItem("utilisateur");

    if (!login) {

        window.location.href = "index.html";

        return false;
    }

    try {

        const q = query(
            collection(db, "utilisateurs"),
            where("login", "==", login),
            where("role", "==", "admin")
        );

        const querySnapshot =
            await getDocs(q);

        if (querySnapshot.empty) {

            alert("❌ Accès refusé");

            window.location.href =
                "accueil.html";

            return false;
        }

        return true;

    } catch (error) {

        console.error(error);

        window.location.href =
            "accueil.html";

        return false;
    }
}


// ===============================
// CHARGEMENT UTILISATEURS
// ===============================
async function chargerUtilisateurs() {

    body.innerHTML = "";

    const querySnapshot =
        await getDocs(collection(db, "utilisateurs"));
    
    document.getElementById("totalUsers").textContent =
        querySnapshot.size;

    querySnapshot.forEach((docFirebase) => {

        let user = docFirebase.data();

        let ligne =
            document.createElement("tr");

        ligne.innerHTML = `

            <td>${user.nom || "-"}</td>

            <td>${user.login || "-"}</td>

            <td>••••••••</td>

            <td>

                <div class="role-container">

                    <img
                        src="${
                            user.role === 'admin'
                                ? 'images/admin-noire.png'
                                : 'images/profil-noire.png'
                        }"
                        class="role-icon"
                    >

                    <select
                        onchange="
                            changerRole(
                                '${docFirebase.id}',
                                this.value
                            )
                        "
                    >

                        <option
                            value="user"
                            ${user.role === "user" ? "selected" : ""}
                        >
                            Utilisateur
                        </option>

                        <option
                            value="admin"
                            ${user.role === "admin" ? "selected" : ""}
                        >
                            Admin
                        </option>

                    </select>

                </div>

            </td>

            <td>

                <button
                    class="btn-supprimer"
                    onclick="
                        supprimerUtilisateur(
                            '${docFirebase.id}'
                        )
                    "
                >
                    <img
                        src="images/supprimer-rouge.png"
                        class="logo-supprimer"
                    >
                </button>

            </td>
        `;

        body.appendChild(ligne);
    });
}


// ===============================
// AJOUT UTILISATEUR
// ===============================
async function ajouterUtilisateur() {

    let nom =
        document.getElementById("nom").value.trim();

    let login =
        document.getElementById("login").value.trim();

    let password =
        document.getElementById("password").value.trim();

    let role =
        document.getElementById("role").value;

    if (
        nom === "" ||
        login === "" ||
        password === ""
    ) {

        alert("Compléter tous les champs");

        return;
    }

    try {

        await addDoc(
            collection(db, "utilisateurs"),
            {
                nom: nom,
                login: login,
                password: password,
                role: role
            }
        );

        alert("✅ Utilisateur ajouté");

        document.getElementById("nom").value = "";

        document.getElementById("login").value = "";

        document.getElementById("password").value = "";

        document.getElementById("role").value = "user";

        chargerUtilisateurs();

    } catch (error) {

        console.error(error);

        alert("❌ Erreur ajout utilisateur");
    }
}


// ===============================
// SUPPRESSION
// ===============================
async function supprimerUtilisateur(id) {

    if (!confirm("Supprimer utilisateur ?")) {
        return;
    }

    try {

        await deleteDoc(
            doc(db, "utilisateurs", id)
        );

        alert("✅ Utilisateur supprimé");

        chargerUtilisateurs();

    } catch (error) {

        console.error(error);

        alert("❌ Erreur suppression");
    }
}


// ===============================
// CHANGEMENT ROLE
// ===============================
async function changerRole(id, nouveauRole) {

    try {

        await updateDoc(
            doc(db, "utilisateurs", id),
            {
                role: nouveauRole
            }
        );

        // Recharge le tableau
        await chargerUtilisateurs();

        alert("✅ Rôle modifié");

    } catch (error) {

        console.error(error);

        alert("❌ Erreur modification rôle");
    }
}


// ===============================
// INIT
// ===============================
async function init() {

    let admin =
        await verifierAdmin();

    if (!admin) {
        return;
    }

    await chargerUtilisateurs();
}

init();
window.ajouterUtilisateur = ajouterUtilisateur;
window.supprimerUtilisateur = supprimerUtilisateur;
window.changerRole = changerRole;

</script>

<script type="module" src="maintenance.js"></script>

</body>
</html>
