<!DOCTYPE html>
<html>
<head>
    <title>SCAN-AIGLE 110</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="style-index.css">
    <link
        rel="icon"
        type="image/png"
        href="images/ASLOGOV1.png"
    >
</head>

<body>

<div class="accueil-container">

    <img 
        src="images/AIGLESCAN-V1.png"
        class="logo-index"
    >

    <p class="version-app">
        Version 3.1
    </p>

    <p class="status-app">
        <img src="images/verifier.png" alt="status-app">
        Système opérationnel
    </p>

    <div class="zone-connexion">

        <input
            type="text"
            id="login"
            placeholder="Login"
            autocapitalize="off"
            autocomplete="username"
            autocorrect="off"
            spellcheck="false"
        >

        <input
            type="password"
            id="password"
            placeholder="Mot de passe"
            autocomplete="current-password"
        >

        <button
            class="btn-connexion"
            onclick="connexion()"
        >
            <span>Connexion</span>

            <img
                src="images/entre-blanc.png"
                class="logo-connexion"
            >

        </button>

        <p id="erreurConnexion"></p>

    </div>

</div>

<script type="module">

import { db, auth } from "./firebase-config.js";
import { ajouterHistorique } from "./historique.js";
import {
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {
    signInWithEmailAndPassword,
    signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

// ===============================
// INTERFACE UTILISATEUR
// ===============================

document.getElementById("login")
.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {

        event.preventDefault();

        document.getElementById("password").focus();
    }
});

document.getElementById("password")
.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {

        event.preventDefault();

        this.blur();
    }
});


// ===============================
// CONNEXION UTILISATEUR
// ===============================
async function connexion() {

    const login =
        document.getElementById("login").value.trim().toLowerCase();

    const password =
        document.getElementById("password").value.trim();

    const erreur =
        document.getElementById("erreurConnexion");

    erreur.innerText = "";

    if (login === "" || password === "") {

        erreur.innerText =
            "❌ Veuillez remplir tous les champs";

        return;
    }

    try {

        // ===============================
        // CONNEXION FIREBASE AUTH
        // ===============================

        const emailFirebase =
            login + "@aiglescan.local";

        const userCredential =
        await signInWithEmailAndPassword(
            auth,
            emailFirebase,
            password
        );
        const uid = userCredential.user.uid;

        // ===============================
        // VÉRIFICATION UTILISATEUR
        // ===============================

        const utilisateurRef =
            doc(
                db,
                "utilisateurs",
                uid
            );

        const utilisateurSnap =
            await getDoc(utilisateurRef);


        if (!utilisateurSnap.exists()) {

            await signOut(auth);

            localStorage.removeItem("utilisateur");
            localStorage.removeItem("fichierActif");

            erreur.innerText =
                "❌ Utilisateur non reconnu";

            return;
        }

        const utilisateur = utilisateurSnap.data();
        const estAdmin = utilisateur.role === "admin";

        // ===============================
        // SAUVEGARDE SESSION
        // ===============================

        localStorage.setItem(
            "utilisateur",
            login
        );

        // ===============================
        // HISTORIQUE
        // ===============================

        await ajouterHistorique(
            "Connexion utilisateur",
            "",
            {
                login: login
            }
        );

        // ===============================
        // VÉRIFICATION MAINTENANCE
        // ===============================

        if (
            window.systemeHorsService &&
            !estAdmin
        ) {

            // Déconnexion réelle de Firebase
            await signOut(auth);

            // Nettoyage de la session locale
            localStorage.removeItem("utilisateur");
            localStorage.removeItem("fichierActif");

            erreur.innerText =
                "❌ Système actuellement hors service";

            return;
        }

        // ===============================
        // REDIRECTION
        // ===============================

        window.location.href =
            "accueil.html";


    } catch (error) {

        console.error(
            "Erreur connexion Firebase :",
            error
        );

        erreur.innerText =
            "❌ Identifiants incorrects";
    }
}

// ===============================
// CHARGEMENT ÉTAT SYSTÈME
// ===============================
async function chargerEtatSysteme() {

    try {

        const docRef =
            doc(db, "configuration", "systeme");

        const docSnap =
            await getDoc(docRef);

        if (docSnap.exists()) {

            const data =
                docSnap.data();

            let maintenance =
                data.maintenance;

            let status =
                document.querySelector(".status-app");

            if (maintenance === true) {

                window.systemeHorsService = true;

                status.innerHTML = `
                    <img src="images/croix.png">
                    Système hors service
                `;

                status.style.color = "#EA3E4E";

            } else {

                window.systemeHorsService = false;

                status.innerHTML = `
                    <img src="images/verifier.png">
                    Système opérationnel
                `;

                status.style.color = "#81BF60";

            }
        }

    } catch (error) {

        console.error(error);
    }
}

// ===============================
// INIT
// ===============================

chargerEtatSysteme();
window.connexion = connexion;

</script>

</body>
</html>
