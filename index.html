<!DOCTYPE html>
<html>
<head>
    <title>SCAN-AIGLE 110</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="style-index.css">
    <link
        rel="icon"
        type="image/png"
        href="images/ASLOGOV1.png"
    >
</head>

<body>

<div class="accueil-container">

    <img 
        src="images/AIGLESCAN-V1.png"
        class="logo-index"
    >

    <p class="version-app">
        Version 3.1
    </p>

    <p class="status-app">
        <img src="images/verifier.png" alt="status-app">
        Système opérationnel
    </p>

    <div class="zone-connexion">

        <input
            type="text"
            id="login"
            placeholder="Login"
            autocapitalize="off"
            autocomplete="username"
            autocorrect="off"
            spellcheck="false"
        >

        <input
            type="password"
            id="password"
            placeholder="Mot de passe"
            autocomplete="current-password"
        >

        <button
            class="btn-connexion"
            onclick="connexion()"
        >
            <span>Connexion</span>

            <img
                src="images/entre-blanc.png"
                class="logo-connexion"
            >

        </button>

        <p id="erreurConnexion"></p>

    </div>

</div>

<script type="module">

import { db } from "./firebase-config.js";
import { ajouterHistorique } from "./historique.js";
import {
    doc,
    getDoc,
    updateDoc,
    collection,
    query,
    where,
    getDocs,
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ===============================
// INTERFACE UTILISATEUR
// ===============================

document.getElementById("login")
.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {

        event.preventDefault();

        document.getElementById("password").focus();
    }
});

document.getElementById("password")
.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {

        event.preventDefault();

        this.blur();
    }
});


// ===============================
// CONNEXION UTILISATEUR
// ===============================
async function connexion() {

    let login =
        document.getElementById("login").value.trim();

    let password =
        document.getElementById("password").value.trim();

    let erreur =
        document.getElementById("erreurConnexion");

    erreur.innerText = "";

    if (login === "" || password === "") {

        erreur.innerText =
            "❌ Veuillez remplir tous les champs";

        return;
    }

    try {

        const q = query(
            collection(db, "utilisateurs"),
            where("login", "==", login),
            where("password", "==", password)
        );

        const querySnapshot =
            await getDocs(q);

        if (querySnapshot.empty) {

            erreur.innerText =
                "❌ Identifiants incorrects";

                await ajouterHistorique(
                    "Échec connexion",
                    "",
                    {
                        login: login
                    }
                );
            return;
        }

        // SAUVEGARDE SESSION
        localStorage.setItem(
            "utilisateur",
            login
        );

        await ajouterHistorique(
            "Connexion utilisateur",
            "",
            {
                login: login
            }
        );

        // Vérifie maintenance
        if (window.systemeHorsService) {

            alert("❌ Système actuellement hors service");

            return;
        }

        // Redirection application
        window.location.href = "accueil.html";

    } catch (error) {

        console.error(error);

        erreur.innerText =
            "❌ Erreur connexion";
    }
}


// ===============================
// CHARGEMENT ÉTAT SYSTÈME
// ===============================
async function chargerEtatSysteme() {

    try {

        const docRef =
            doc(db, "configuration", "systeme");

        const docSnap =
            await getDoc(docRef);

        if (docSnap.exists()) {

            const data =
                docSnap.data();

            let maintenance =
                data.maintenance;

            let status =
                document.querySelector(".status-app");

            if (maintenance === true) {

                window.systemeHorsService = true;

                status.innerHTML = `
                    <img src="images/croix.png">
                    Système hors service
                `;

                status.style.color = "#EA3E4E";

            } else {

                window.systemeHorsService = false;

                status.innerHTML = `
                    <img src="images/verifier.png">
                    Système opérationnel
                `;

                status.style.color = "#81BF60";

            }
        }

    } catch (error) {

        console.error(error);
    }
}


// ===============================
// RACCOURCI ADMIN CTRL + C
// ===============================
document.addEventListener("keydown", async function(event) {

    if (event.ctrlKey && event.key.toLowerCase() === "c") {

        event.preventDefault();

        let password =
            prompt("Mot de passe administrateur");

        if (password !== "aiglescan1853") {

            alert("❌ Mot de passe incorrect");

            return;
        }

        try {

            const docRef =
                doc(db, "configuration", "systeme");

            const docSnap =
                await getDoc(docRef);

            let actuel =
                docSnap.data().maintenance;

            await updateDoc(docRef, {
                maintenance: !actuel
            });

            chargerEtatSysteme();

            alert("✅ État système modifié");

        } catch (error) {

            console.error(error);

            alert("❌ Erreur Firebase");
        }
    }
});


// ===============================
// INIT
// ===============================

chargerEtatSysteme();
window.connexion = connexion;

</script>

</body>
</html>
