
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Recherche logistique</title>

    <link rel="stylesheet" href="style-recherche.css">
    <link rel="stylesheet" href="style-session.css">
    <link rel="icon" type="image/png" href="images/ASLOGOV1.png">
</head>

<body>

<div class="btn-accueil">
    <button onclick="window.location.href='accueil.html'">
        <img src="images/accueil2-blanc.png" class="logo-action" alt="">
        <span>Accueil</span>
    </button>
</div>

<h1>RECHERCHE</h1>
<h2>Recherche par scan</h2>

<main class="zone-recherche">

    <div class="ligne-recherche">

        <input
            type="text"
            id="codeRecherche"
            placeholder="Scanner BT, support, interne ou emplacement"
            autocomplete="off"
            spellcheck="false"
        >

        <button id="btnRechercher" onclick="rechercher()">
            Rechercher
        </button>

    </div>

    <p id="messageRecherche"></p>

    <section id="resultats" style="display:none;">

        <div class="resultat-entete">
            <h3 id="titreResultat"></h3>
            <span id="typeResultat"></span>
        </div>

        <div class="informations-grid">

            <div class="information-card">
                <span>N° interne</span>
                <strong id="resultatInterne">-</strong>
            </div>

            <div class="information-card">
                <span>Support(s)</span>
                <strong id="resultatSupports">-</strong>
            </div>

            <div class="information-card">
                <span>Emplacement</span>
                <strong id="resultatEmplacement">-</strong>
            </div>

            <div class="information-card">
                <span>Nombre de colis</span>
                <strong id="resultatTotal">0</strong>
            </div>

        </div>

        <h3>Colis associés</h3>

        <div class="tableau-conteneur">

            <table id="tableResultats">
                <thead>
                    <tr>
                        <th>N° BT</th>
                        <th>État du stock</th>
                    </tr>
                </thead>

                <tbody id="resultatsBody"></tbody>
            </table>

        </div>

    </section>

</main>

<script type="module">

import { db, auth } from "./firebase-config.js";

import {
    collection,
    getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


// ==========================================
// VARIABLES
// ==========================================

let fichiers = [];
let donneesChargees = false;

const champRecherche =
    document.getElementById("codeRecherche");

const messageRecherche =
    document.getElementById("messageRecherche");


// ==========================================
// AUTHENTIFICATION
// ==========================================

onAuthStateChanged(auth, async (user) => {

    if (!user) {
        window.location.href = "index.html";
        return;
    }

    await chargerDonnees();
});


// ==========================================
// CHARGEMENT FIRESTORE
// ==========================================

async function chargerDonnees() {

    messageRecherche.textContent =
        "Chargement des données...";

    try {

        const snapshot = await getDocs(
            collection(db, "fichiersScans")
        );

        fichiers = snapshot.docs.map(document => ({
            id: document.id,
            ...document.data()
        }));

        donneesChargees = true;

        messageRecherche.textContent =
            "Prêt pour le scan";

        champRecherche.focus();

    } catch (error) {

        console.error("Erreur Firebase :", error);

        messageRecherche.textContent =
            "❌ Impossible de charger les données";
    }
}


// ==========================================
// CONVERSION DES DATES
// ==========================================

function convertirDate(valeur) {

    if (!valeur) return 0;

    if (typeof valeur.toMillis === "function") {
        return valeur.toMillis();
    }

    if (typeof valeur === "string") {

        const match = valeur.match(
            /^(\d{2})\/(\d{2})\/(\d{4})$/
        );

        if (match) {
            return new Date(
                Number(match[3]),
                Number(match[2]) - 1,
                Number(match[1])
            ).getTime();
        }
    }

    const resultat = new Date(valeur).getTime();

    return Number.isNaN(resultat) ? 0 : resultat;
}


// ==========================================
// EXTRACTION N° INTERNE
// ==========================================

function extraireInterne(nom) {

    const match = String(nom || "").match(/^(\d{3})/);

    return match ? match[1] : "";
}


// ==========================================
// NORMALISATION DES EMPLACEMENTS
// ==========================================

function normaliserEmplacement(adresse) {

    return String(adresse || "")
        .trim()
        .toUpperCase()
        .replace(/-/g, "");

}


// ==========================================
// CALCUL GLOBAL DU STOCK PAR BT
// ==========================================

function calculerStockGlobal() {

    const stockParBT = new Map();

    fichiers.forEach(fichier => {

        if (
            fichier.type !== "reception" &&
            fichier.type !== "expedition"
        ) {
            return;
        }

        (fichier.contenu || []).forEach(scan => {

            const bt = String(scan.bt || "").trim();

            if (!bt) return;

            if (!stockParBT.has(bt)) {

                stockParBT.set(bt, {
                    receptions: 0,
                    expeditions: 0
                });
            }

            const stock = stockParBT.get(bt);

            if (fichier.type === "reception") {
                stock.receptions++;
            }

            if (fichier.type === "expedition") {
                stock.expeditions++;
            }

        });
    });

    return stockParBT;
}


// ==========================================
// RECHERCHE
// ==========================================

function rechercher() {

    const valeur = champRecherche.value.trim();
    
    messageRecherche.style.color = "";

    if (!valeur) {
        messageRecherche.textContent =
            "❌ Scanner ou saisir un code";
        return;
    }

    if (!donneesChargees) {
        messageRecherche.textContent =
            "Chargement en cours...";
        return;
    }

    const scans = [];

    const mouvements = [];

    fichiers.forEach(fichier => {

        const interne = extraireInterne(fichier.nom);

        const dateFichier = convertirDate(
            fichier.dateCreation
        );

        (fichier.contenu || []).forEach(scan => {

            if (fichier.type === "adresse") {

                mouvements.push({
                    interne,
                    support: String(scan.support || "").trim(),
                    adresse: String(scan.adresse || "").trim(),
                    date: convertirDate(
                        scan.dateCreation || fichier.dateCreation
                    ),
                    id: fichier.id
                });

            } else if (
                fichier.type === "reception" ||
                fichier.type === "expedition"
            ) {

                scans.push({
                    interne,
                    support: String(scan.support || "").trim(),
                    bt: String(scan.bt || "").trim(),
                    type: fichier.type,
                    date: dateFichier,
                    dateAffichage:
                        scan.date || fichier.dateCreation || "-"
                });
            }
        });
    });


    // ======================================
    // DÉTECTION AUTOMATIQUE
    // ======================================

    let typeRecherche = "";

    if (scans.some(s => s.bt === valeur)) {
        typeRecherche = "BT";
    } else if (
        scans.some(s => s.support === valeur) ||
        mouvements.some(m => m.support === valeur)
    ) {
        typeRecherche = "SUPPORT";
    } else if (/^\d{3}$/.test(valeur)) {
        typeRecherche = "INTERNE";
    } else {
        typeRecherche = "EMPLACEMENT";
    }


    // ======================================
    // CORRESPONDANCES
    // ======================================

    let correspondances = [];

    if (typeRecherche === "BT") {

        // ======================================
        // CONTRÔLE BT SUR PLUSIEURS SUPPORTS
        // ======================================

        // Toutes les réceptions du BT recherché
        const receptionsBT = scans.filter(s =>
            s.type === "reception" &&
            s.bt === valeur
        );

        // Liste des supports de réception distincts
        const supportsReception = new Set(
            receptionsBT
                .map(s => s.support)
                .filter(Boolean)
        );

        // Anomalie si plusieurs supports différents
        if (supportsReception.size > 1) {

            document.getElementById("resultats")
                .style.display = "none";

            messageRecherche.textContent =
                "❌ Anomalie : ce numéro de BT est associé à plusieurs supports de réception différents.";

            messageRecherche.style.color = "#dc2626";

            return;
        }

        // ======================================
        // RECHERCHE DU BT SCANNÉ
        // ======================================

        const colisTrouves = scans.filter(
            s => s.bt === valeur
        );

        // ======================================
        // IDENTIFICATION DE LA PALETTE
        // Priorité aux données de réception
        // ======================================

        const colisReference =
            receptionsBT.find(s => s.support) ||
            receptionsBT[0] ||
            colisTrouves.find(s => s.support) ||
            colisTrouves[0];

        const supportPalette =
            colisReference?.support || "";

        const internePalette =
            colisReference?.interne || "";

        // ======================================
        // TOUS LES BT DE LA MÊME PALETTE
        // ======================================

        correspondances = scans.filter(s => {

            if (supportPalette) {

                // Recherche par support de réception
                if (
                    s.type === "reception" &&
                    s.support === supportPalette
                ) {
                    return true;
                }

                // Récupère également les expéditions
                // des BT appartenant à la palette
                const btReceptionPalette = scans.some(r =>
                    r.type === "reception" &&
                    r.support === supportPalette &&
                    r.bt === s.bt
                );

                return btReceptionPalette;
            }

            // Si aucun support n'est disponible,
            // recherche par numéro interne
            if (internePalette) {
                return s.interne === internePalette;
            }

            return s.bt === valeur;
        });

    } else if (typeRecherche === "SUPPORT") {

        correspondances = scans.filter(
            s => s.support === valeur
        );

    } else if (typeRecherche === "INTERNE") {

        correspondances = scans.filter(
            s => s.interne === valeur
        );

    } else {

        // ======================================
        // RECHERCHE PAR EMPLACEMENT
        // ======================================

        const palettesEmplacement = mouvements.filter(
            m =>
                normaliserEmplacement(m.adresse) ===
                normaliserEmplacement(valeur)
        );

        // Numéros internes présents à cet emplacement
        const internes = new Set(
            palettesEmplacement
                .map(m => m.interne)
                .filter(Boolean)
        );

        // Supports associés à cet emplacement
        const supports = new Set(
            palettesEmplacement
                .map(m => m.support)
                .filter(Boolean)
        );

        // Recherche des BT associés aux palettes
        correspondances = scans.filter(s => {

            return (
                supports.has(s.support) ||
                internes.has(s.interne)
            );

        });
    }


    // ======================================
    // AUCUN RÉSULTAT
    // ======================================

    if (correspondances.length === 0) {

        document.getElementById("resultats")
            .style.display = "none";

        messageRecherche.textContent =
            "❌ Aucun résultat trouvé";

        return;
    }


    // ======================================
    // EMPLACEMENT ACTUEL
    // ======================================

    // Supports des colis trouvés
    const supportsTrouves = new Set(
        correspondances
            .map(s => s.support)
            .filter(Boolean)
    );

    // Numéros internes des colis trouvés
    const internesTrouves = new Set(
        correspondances
            .map(s => s.interne)
            .filter(Boolean)
    );

    // Recherche des emplacements associés
    const mouvementsAssocies = mouvements.filter(m => {

        return (
            (m.support && supportsTrouves.has(m.support)) ||
            (m.interne && internesTrouves.has(m.interne))
        );

    });

    // Suppression des doublons d'emplacement
    const emplacementsActuels = [
        ...new Set(
            mouvementsAssocies
                .map(m => m.adresse)
                .filter(Boolean)
        )
    ];

    // Emplacement affiché
    const dernierEmplacement =
        emplacementsActuels.join(", ") || "-";
        

    // ======================================
    // REGROUPEMENT DES BT SANS DOUBLONS
    // ======================================

    const lignes = new Map();

    // Calcul sur tous les fichiers Firestore
    const stockGlobal = calculerStockGlobal();

    correspondances.forEach(scan => {

        const bt = String(scan.bt || "").trim();

        if (!bt) return;

        if (!lignes.has(bt)) {

            lignes.set(bt, {
                bt: bt,
                support: "",
                interne: scan.interne,
                receptions: 0,
                expeditions: 0
            });
        }

        const ligne = lignes.get(bt);

        // Priorité au support de réception
        if (scan.type === "reception" && scan.support) {
            ligne.support = scan.support;
        }

        if (!ligne.interne && scan.interne) {
            ligne.interne = scan.interne;
        }

    });

    // Récupération du stock réel de chaque BT
    lignes.forEach(ligne => {

        const stock = stockGlobal.get(ligne.bt);

        ligne.receptions = stock?.receptions || 0;
        ligne.expeditions = stock?.expeditions || 0;

    });

    afficherResultats(
        valeur,
        typeRecherche,
        [...lignes.values()],
        dernierEmplacement
    );
}


// ==========================================
// AFFICHAGE
// ==========================================

function afficherResultats(
    valeur,
    type,
    lignes,
    emplacement
) {

    document.getElementById("resultats")
        .style.display = "block";

    messageRecherche.textContent = "";

    document.getElementById("titreResultat")
        .textContent = valeur;

    document.getElementById("typeResultat")
        .textContent = type;

    document.getElementById("resultatInterne")
        .textContent =
        [...new Set(lignes.map(l => l.interne))]
            .filter(Boolean)
            .join(", ") || "-";

    document.getElementById("resultatSupports")
        .textContent =
        [...new Set(lignes.map(l => l.support))]
            .filter(Boolean)
            .join(", ") || "-";

    document.getElementById("resultatEmplacement")
        .textContent = emplacement;

    document.getElementById("resultatTotal")
        .textContent =
        new Set(lignes.map(l => l.bt)).size;

    const tbody =
        document.getElementById("resultatsBody");

    tbody.innerHTML = "";

    lignes.forEach(ligne => {

        const tr = document.createElement("tr");

        const stockReel =
            ligne.receptions - ligne.expeditions;

        let statut = "";
        let classeStatut = "";

        if (stockReel > 0) {
            statut = "En stock";
            classeStatut = "en-stock";
        } else if (stockReel === 0) {
            statut = "Épuisé";
            classeStatut = "epuise";
        } else {
            statut = "Anomalie";
            classeStatut = "anomalie";
        }

        // Colonne numéro BT
        const celluleBT = document.createElement("td");
        celluleBT.textContent = ligne.bt;

        // Colonne état du stock
        const celluleStatut = document.createElement("td");

        const badge = document.createElement("span");

        badge.className =
            "badge-stock " + classeStatut;

        badge.textContent = statut;

        celluleStatut.appendChild(badge);

        tr.appendChild(celluleBT);
        tr.appendChild(celluleStatut);

        tbody.appendChild(tr);
    });
}


// ==========================================
// VALIDATION CLAVIER / SCANNER
// ==========================================

champRecherche.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {
            event.preventDefault();
            rechercher();
        }
    }
);

window.rechercher = rechercher;

</script>

<script type="module" src="maintenance.js"></script>
<script type="module" src="session-timeout.js"></script>

</body>
</html>
