<!DOCTYPE html>
<html>
<head>
    <title>Accueil</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="style-accueil.css">
    <link
        rel="icon"
        type="image/png"
        href="images/ASLOGOV1.png"
    >
</head>

<body>

<div class="utilisateur-connecte">

    <div class="utilisateur-info">

        <img
            src="images/profil-blanc.png"
            class="logo-profil"
        >

        <span id="nomUtilisateur">
            Chargement...
        </span>

    </div>

    <button onclick="deconnexion()">

        <img
            src="images/deconnexion-noire.png"
            class="logo-deconnexion"
        >
        <span>Déconnexion</span>

    </button>

</div>

<div class="accueil-container">

    <h1>ACCUEIL</h1>

    <div class="menu-card">

        <p class="sous-titre">
            Sélectionnez un module
        </p>

        <div class="menu">

        <a href="reception.html">
            <button>
                <img
                    src="images/reception3-blanc.png"
                    class="logo-menu"
                >
                <span>Réception</span>
                <img
                    src="images/entre-blanc.png"
                    class="logo-entre"
                >
            </button>
        </a>

        <a href="adresse.html">
            <button>
                <img
                    src="images/emplacement-blanc.png"
                    class="logo-menu"
                >
                <span>Mouvement</span>
                <img
                    src="images/entre-blanc.png"
                    class="logo-entre"
                >
            </button>
        </a>

        <a href="expedition.html">
            <button>
                <img
                    src="images/expedition2-blanc.png"
                    class="logo-menu"
                >
                <span>Expédition</span>
                <img
                    src="images/entre-blanc.png"
                    class="logo-entre"
                >
            </button>
        </a>

        <a href="fichier.html">
            <button>
                <img
                    src="images/fichier-blanc.png"
                    class="logo-menu"
                >
                <span>Fichiers</span>
                <img
                    src="images/entre-blanc.png"
                    class="logo-entre"
                >
            </button>
        </a>

        </div>

    </div>

    <div
        class="menu-card admin-card"
        id="adminPanel"
        style="display:none;"
    >

        <p class="sous-titre">
            Module Administrateur
        </p>

        <div class="menu">

            <a href="historique.html">
                <button>
                <img
                    src="images/historique-blanc.png"
                    class="logo-menu"
                >
                <span>Historique</span>
                <img
                    src="images/entre-blanc.png"
                    class="logo-entre"
                >
            </button>
            </a>

            <a href="utilisateurs.html">
                <button>
                    <img
                        src="images/utilisateurs-blanc.png"
                        class="logo-menu"
                    >
                    <span>Utilisateurs</span>
                    <img
                        src="images/entre-blanc.png"
                        class="logo-entre"
                    >
                </button>
            </a>

        </div>

    </div>

</div>

</div>

<script type="module">

import { db } from "./firebase-config.js";
import { ajouterHistorique } from "./historique.js";
import {
    collection,
    query,
    where,
    getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

if (!localStorage.getItem("utilisateur")) { window.location.href = "index.html"; }

// ===============================
// DÉCONNEXION
// ===============================
async function deconnexion() {

    let utilisateur =
        localStorage.getItem("utilisateur");

    await ajouterHistorique(
        "Déconnexion utilisateur",
        "",
        {
            login: utilisateur
        }
    );

    localStorage.removeItem("utilisateur");

    window.location.href =
        "index.html";
}


// ===============================
// DETAILS CONNEXION UTILISATEUR
// ===============================
async function chargerNomUtilisateur() {

    let login =
        localStorage.getItem("utilisateur");

    if (!login) {
        return;
    }

    try {

        const q = query(
            collection(db, "utilisateurs"),
            where("login", "==", login)
        );

        const querySnapshot =
            await getDocs(q);

        if (!querySnapshot.empty) {

            let utilisateur =
                querySnapshot.docs[0].data();

            document.getElementById("nomUtilisateur")
                .innerText =
                "Connecté : " +
                (utilisateur.nom || login);
        }

    } catch (error) {

        console.error(error);
    }
}


// ===============================
// VÉRIFICATION ADMIN
// ===============================
async function verifierAdmin() {

    let login =
        localStorage.getItem("utilisateur");

    if (!login) {
        return;
    }

    try {

        const q = query(
            collection(db, "utilisateurs"),
            where("login", "==", login),
            where("role", "==", "admin")
        );

        const querySnapshot =
            await getDocs(q);

        if (!querySnapshot.empty) {

            document.getElementById("adminPanel").style.display =
                "block";
        }

    } catch (error) {

        console.error(error);
    }
}

verifierAdmin();
chargerNomUtilisateur();
window.deconnexion = deconnexion;

</script>

<script type="module" src="maintenance.js"></script>

</body>
</html>
