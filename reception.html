<!DOCTYPE html>
<html>
<head>
    <title>Réception</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="style-reception.css">
    <link
        rel="icon"
        type="image/png"
        href="images/ASLOGOV1.png"
    >
</head>

<body>

<div class="btn-accueil">

    <button onclick="window.location.href='accueil.html'">
        <img
            src="images/accueil2-blanc.png"
            class="logo-action"
        >
        <span>Accueil</span>

    </button>

</div>

<div class="btn-retour" id="btnRetour" style="display:none;">

    <button onclick="retourEtape1()">
        <img
            src="images/retour-blanc.png"
            class="logo-action"
        >
        <span>Retour</span>
    </button>

</div>

<div class="btn-infos" onclick="ouvrirInfos()">
    <img src="images/INFOS-BLANC.png" alt="Infos">
</div>

<h1>RÉCEPTION</h1>

<h2 id="titreFichier">Création fichier</h2>

<div class="zone-principale" id="zonePrincipale">

    <h3 id="texteCommentaire" style="display:none;"></h3>
    
    <!-- ÉTAPE 1 -->
    <div id="blocCommentaire">

        <div class="ligne-validation">

            <input 
                type="text"
                id="commentaire"
                placeholder="Nom de la réception"
                autocapitalize="off"
                autocorrect="off"
                spellcheck="false"
                autocomplete="off"
            >

            <button onclick="validerCommentaire()">
                <span>Suivant</span>
                <img
                    src="images/entre-blanc.png"
                    class="logo-bouton"
                >
            </button>

        </div>

    </div>

    <!-- ÉTAPE 2 -->
    <div id="blocPalette" style="display:none; margin-top:20px;">

        <div class="ligne-check">
            <input 
                type="text"
                id="palette"
                placeholder="Numéro interne"
                maxlength="3"
                inputmode="numeric"
                autocapitalize="off"
                autocorrect="off"
                spellcheck="false"
                autocomplete="off"
                oninput="verifPalette(this); verifierPalette();"
            >

            <button id="btnCheck" disabled>
                <img
                    src="images/croix.png"
                    class="logo-check"
                >
            </button>

        </div>

        <div class="ligne-validation" style="margin-top:15px;">
            
            <button
                id="btnfichier"
                onclick="creerFichier()"
            >
                <span>Créer fichier</span>
                <img
                    src="images/entre-blanc.png"
                    class="logo-bouton"
                >
            </button>

        </div>

    </div>

</div>

<div id="popupInfos" class="popup-infos">

    <div class="popup-contenu">

        <div class="popup-header">

            <button
                class="btn-fermer"
                onclick="fermerInfos()"
            >
                ✕
            </button>

        </div>

        <iframe
            src="infos-reception.html"
            id="iframeInfos"
        >
        </iframe>

    </div>

</div>

<script type="module">

import { ajouterHistorique } from "./historique.js";

if (!localStorage.getItem("utilisateur")) { window.location.href = "index.html"; }

// ===============================
// ÉTAPE 1 : VALIDATION COMMENTAIRE
// ===============================
function validerCommentaire() {

    let commentaire = document.getElementById("commentaire").value.trim();

    // Vérifie si vide
    if (commentaire === "") {
        alert("Veuillez renseigner un commentaire");
        return;
    }

    // Modifier le sous-titre avec commentaire
    document.getElementById("texteCommentaire").innerText = commentaire;

    document.getElementById("texteCommentaire").style.display = "block";

    // Faire disparaître complètement le bloc commentaire
    document.getElementById("blocCommentaire").style.display = "none";

    // Faire apparaître le bloc numéro interne
    document.getElementById("blocPalette").style.display = "block";

    // Faire apparaître bouton retour
    document.getElementById("btnRetour").style.display = "block"
}


// ===============================
// RETOUR ÉTAPE 1
// ===============================
function retourEtape1() {

    // Cache étape 2
    document.getElementById("blocPalette").style.display =
        "none";

    // Réaffiche étape 1
    document.getElementById("blocCommentaire").style.display =
        "block";

    // Cache bouton retour
    document.getElementById("btnRetour").style.display =
        "none";

    // Réinitialise titre
    document.getElementById("titreFichier").innerText =
        "Création fichier";

    // Reset commentaire affiché
    document.getElementById("texteCommentaire").innerText =
        "";

    document.getElementById("texteCommentaire").style.display =
        "none";

    // Reset palette
    document.getElementById("palette").value =
        "";

    // Reset bouton check
    document.getElementById("btnCheck").innerHTML =
    `
    <img
        src="images/croix.png"
        class="logo-check"
    >
    `;

    document.getElementById("btnCheck").classList.remove("valide");

    document.getElementById("btnCheck").classList.add("invalide");

}


// ===============================
// CONTRÔLE INPUT NUMÉRO INTERNE
// ===============================
function verifPalette(champ) {

    // Supprime tout sauf chiffres
    champ.value = champ.value.replace(/[^0-9]/g, '');

    // Max 3 caractères
    if (champ.value.length > 3) {
        champ.value = champ.value.slice(0, 3);
    }
}


// ===============================
// CHECK VISUEL
// ===============================
function verifierPalette() {

    let champPalette = document.getElementById("palette");
    let valeur = champPalette.value;

    let bouton = document.getElementById("btnCheck");

    // Vérifie exactement 3 chiffres
    let estValide = /^\d{3}$/.test(valeur);

    if (estValide) {
        bouton.innerHTML =
        `
        <img
            src="images/verifier.png"
            class="logo-check"
        >
        `;
        bouton.classList.remove("invalide");
        bouton.classList.add("valide");
        champPalette.blur();
    } else {
        bouton.innerHTML =
        `
        <img
            src="images/croix.png"
            class="logo-check"
        >
        `;
        bouton.classList.remove("valide");
        bouton.classList.add("invalide");
    }
}


// ===============================
// CRÉATION DU FICHIER + OUVERTURE
// ===============================
async function creerFichier() {

    // Récupération numéro interne
    let palette = document.getElementById("palette").value;

    // Récupération commentaire
    let commentaire = document.getElementById("texteCommentaire")
    .innerText.replace("Commentaire : ", "");

    // Vérification stricte
    if (!/^\d{3}$/.test(palette)) {
        alert("Numéro interne invalide");
        return;
    }

    // Date automatique
    let today = new Date();

    let jour = String(today.getDate()).padStart(2, '0');
    let mois = String(today.getMonth() + 1).padStart(2, '0');
    let annee = today.getFullYear();

    let date = jour + "/" + mois + "/" + annee;

    await ajouterHistorique(
        "Création préparation réception",
        palette + " - " + commentaire,
        {
            palette: palette,
            commentaire: commentaire,
            type: "reception"
        }
    );

    // Redirection vers scan.html
    window.location.href =
        "reception-scan.html?palette=" + palette +
        "&commentaire=" + encodeURIComponent(commentaire) +
        "&date=" + date;
}


// ===============================
// GESTION CLAVIER
// ===============================
document.getElementById("commentaire")
.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {

        event.preventDefault();

        this.blur();
    }
});

document.getElementById("palette")
.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {

        event.preventDefault();

        this.blur();
    }
});


// ===============================
// GESTION INFOS
// ===============================
function ouvrirInfos() {

    document
        .getElementById("popupInfos")
        .classList.add("active");
}

function fermerInfos() {

    document
        .getElementById("popupInfos")
        .classList.remove("active");
}

window.ouvrirInfos = ouvrirInfos;
window.fermerInfos = fermerInfos;
window.validerCommentaire = validerCommentaire;
window.retourEtape1 = retourEtape1;
window.verifPalette = verifPalette;
window.verifierPalette = verifierPalette;
window.creerFichier = creerFichier;

</script>

<script type="module" src="maintenance.js"></script>

</body>
</html>
