<!DOCTYPE html>
<html>

<head>
    <title>Historique</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="style-historique.css">
    <link
        rel="icon"
        type="image/png"
        href="images/ASLOGOV1.png"
    >
</head>

<body>

<div class="btn-accueil">

    <button onclick="window.location.href='accueil.html'">
        <img
            src="images/accueil2-blanc.png"
            class="logo-action"
        >
        <span>Accueil</span>

    </button>

</div>

<h1>HISTORIQUE</h1>

<h2>Suivi des actions utilisateurs</h2>

<p id="infos">
    Nombre d'événements :
    <span id="totalHistorique">0</span>
</p>

<div class="filtres-historique">

    <input
        type="text"
        id="filtreUtilisateur"
        placeholder="Filtre utilisateur"
    >

    <input
        type="text"
        id="filtreAction"
        placeholder="Filtre action"
    >

    <input
        type="date"
        id="filtreDate"
    >

    <button onclick="filtrerHistorique()">
        <img
            src="images/filtre-blanc.png"
            class="logo-action"
        >
        <span>Filtrer</span>
    </button>

    <button onclick="resetFiltres()">
        <img
            src="images/reset-blanc.png"
            class="logo-action"
        >
        <span>Reset</span>
    </button>


    <button onclick="exportHistoriqueExcel()">
        <img
            src="images/exporter-blanc.png"
            class="logo-action"
        >
        <span>Export Excel</span>
        <img
            src="images/entre-blanc.png"
            class="logo-bouton"
        >
    </button>

    <button
        class="btn-supprimer-selection"
        onclick="supprimerSelectionHistorique()"
    >
        <span>Supprimer la sélection</span>
    </button>

</div>

<div
    id="barreDefilementHistorique"
    class="barre-defilement-historique"
    aria-label="Défilement horizontal du tableau"
>
    <div id="largeurBarreDefilementHistorique"></div>
</div>

<div class="historique-container">

    <table id="tableHistorique">

        <thead>

            <tr>

                <th>
                    <input
                        type="checkbox"
                        id="selectionnerTout"
                        onchange="selectionnerToutesLesLignes(this.checked)"
                        title="Sélectionner toutes les lignes affichées"
                    >
                </th>

                <th>Date</th>

                <th>Utilisateur</th>

                <th>Action</th>

                <th>Fichier</th>

                <th>Type</th>

                <th>Support</th>

                <th>BT</th>

                <th>Adresse</th>

                <th>Palette</th>

                <th>Page</th>

            </tr>

        </thead>

        <tbody id="historiqueBody">
        </tbody>

    </table>

</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script type="module">

import { db } from "./firebase-config.js";
import {
    collection,
    getDocs,
    query,
    orderBy,
    where,
    doc,
    writeBatch
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

if (!localStorage.getItem("utilisateur")) { window.location.href = "index.html"; }


// ===============================
// TABLEAU
// ===============================
let body =
    document.getElementById("historiqueBody");
let historiqueData = [];

const tableauHistorique =
    document.getElementById("tableHistorique");

const conteneurHistorique =
    document.querySelector(".historique-container");

const barreDefilementHistorique =
    document.getElementById("barreDefilementHistorique");

let synchronisationDefilementEnCours = false;


// ===============================
// SÉCURITÉ ADMIN
// ===============================
async function verifierAdmin() {

    let login =
        localStorage.getItem("utilisateur");

    // PAS CONNECTÉ
    if (!login) {

        window.location.href = "index.html";

        return false;
    }

    try {

        const q = query(
            collection(db, "utilisateurs"),
            where("login", "==", login),
            where("role", "==", "admin")
        );

        const querySnapshot =
            await getDocs(q);

        // PAS ADMIN
        if (querySnapshot.empty) {

            alert("❌ Accès refusé");

            window.location.href =
                "accueil.html";

            return false;
        }

        return true;

    } catch (error) {

        console.error(error);

        window.location.href =
            "accueil.html";

        return false;
    }
}


// ===============================
// CHARGEMENT HISTORIQUE
// ===============================
async function chargerHistorique() {

    try {

        const q = query(
            collection(db, "historique"),
            orderBy("timestamp", "desc")
        );

        const querySnapshot =
            await getDocs(q);
        
        document.getElementById("totalHistorique").textContent =
            querySnapshot.size;

        body.innerHTML = "";
        historiqueData = [];

        querySnapshot.forEach((doc) => {

            let data = doc.data();

            historiqueData.push({
                id: doc.id,
                ...data
            });

        });

        afficherHistorique(historiqueData);

    } catch (error) {

        console.error(error);

        body.innerHTML = `
            <tr>
                <td colspan="11">
                    ❌ Erreur chargement historique
                </td>
            </tr>
        `;
    }
}


// ===============================
// AFFICHAGE TABLEAU
// ===============================
function afficherHistorique(dataArray) {

    body.innerHTML = "";

    document.getElementById("selectionnerTout").checked =
        false;

    dataArray.forEach((data) => {

        let ligne =
            document.createElement("tr");

        ligne.innerHTML = `

            <td>
                <input
                    type="checkbox"
                    class="selection-historique"
                    value="${data.id}"
                    onchange="mettreAJourSelectionGlobale()"
                >
            </td>

            <td>${data.date || "-"}</td>

            <td>${data.utilisateur || "-"}</td>

            <td>${data.action || "-"}</td>

            <td>${data.fichier || "-"}</td>

            <td>${data.type || "-"}</td>

            <td>${data.support || "-"}</td>

            <td>${data.bt || "-"}</td>

            <td>${data.adresse || "-"}</td>

            <td>${data.palette || "-"}</td>

            <td>${data.page || "-"}</td>
        `;

        body.appendChild(ligne);
    });

    actualiserBarreDefilementHistorique();
}


// ===============================
// BARRE DE DÉFILEMENT EN HAUT
// ===============================
function actualiserBarreDefilementHistorique() {

    document.getElementById(
        "largeurBarreDefilementHistorique"
    ).style.width =
        `${tableauHistorique.scrollWidth}px`;
}


barreDefilementHistorique.addEventListener(
    "scroll",
    () => {

        if (synchronisationDefilementEnCours) {
            return;
        }

        synchronisationDefilementEnCours = true;

        conteneurHistorique.scrollLeft =
            barreDefilementHistorique.scrollLeft;

        synchronisationDefilementEnCours = false;
    }
);


conteneurHistorique.addEventListener(
    "scroll",
    () => {

        if (synchronisationDefilementEnCours) {
            return;
        }

        synchronisationDefilementEnCours = true;

        barreDefilementHistorique.scrollLeft =
            conteneurHistorique.scrollLeft;

        synchronisationDefilementEnCours = false;
    }
);


window.addEventListener(
    "resize",
    actualiserBarreDefilementHistorique
);


// ===============================
// SÉLECTION ET SUPPRESSION
// ===============================
function selectionnerToutesLesLignes(selectionnee) {

    document.querySelectorAll(
        ".selection-historique"
    ).forEach((caseSelection) => {

        caseSelection.checked = selectionnee;
    });
}


function mettreAJourSelectionGlobale() {

    const casesSelection =
        document.querySelectorAll(
            ".selection-historique"
        );

    const toutesSelectionnees =
        casesSelection.length > 0 &&
        Array.from(casesSelection).every(
            caseSelection => caseSelection.checked
        );

    document.getElementById("selectionnerTout").checked =
        toutesSelectionnees;
}


async function supprimerSelectionHistorique() {

    const identifiantsSelectionnes =
        Array.from(
            document.querySelectorAll(
                ".selection-historique:checked"
            )
        ).map((caseSelection) => caseSelection.value);

    if (identifiantsSelectionnes.length === 0) {

        alert("Sélectionne au moins une ligne à supprimer.");

        return;
    }

    const confirmation =
        confirm(
            `Supprimer définitivement ${identifiantsSelectionnes.length} ligne(s) sélectionnée(s) ?`
        );

    if (!confirmation) {
        return;
    }

    try {

        while (identifiantsSelectionnes.length > 0) {

            const lot =
                identifiantsSelectionnes.splice(0, 500);

            const batch =
                writeBatch(db);

            lot.forEach((id) => {

                batch.delete(
                    doc(db, "historique", id)
                );
            });

            await batch.commit();
        }

        alert("✅ Les lignes sélectionnées ont été supprimées.");

        await chargerHistorique();

    } catch (error) {

        console.error(error);

        alert("❌ Erreur pendant la suppression.");
    }
}


// ===============================
// FILTRE HISTORIQUE
// ===============================
function filtrerHistorique() {

    let filtreUtilisateur =
        document.getElementById("filtreUtilisateur")
        .value
        .toLowerCase();

    let filtreAction =
        document.getElementById("filtreAction")
        .value
        .toLowerCase();

    let filtreDate =
        document.getElementById("filtreDate")
        .value;

    let resultat =
        historiqueData.filter((data) => {

            let okUtilisateur =
                !filtreUtilisateur ||
                (data.utilisateur || "")
                .toLowerCase()
                .includes(filtreUtilisateur);

            let okAction =
                !filtreAction ||
                (data.action || "")
                .toLowerCase()
                .includes(filtreAction);

            let okDate =
                !filtreDate ||
                (data.date || "")
                .includes(
                    filtreDate.split("-").reverse().join("/")
                );

            return (
                okUtilisateur &&
                okAction &&
                okDate
            );
        });

    afficherHistorique(resultat);
}


// ===============================
// RESET FILTRES
// ===============================
function resetFiltres() {

    document.getElementById("filtreUtilisateur").value = "";

    document.getElementById("filtreAction").value = "";

    document.getElementById("filtreDate").value = "";

    afficherHistorique(historiqueData);
}


// ===============================
// EXPORT EXCEL
// ===============================
function exportHistoriqueExcel() {

    let data = [];

    data.push([
        "Date",
        "Utilisateur",
        "Action",
        "Fichier",
        "Type",
        "Support",
        "BT",
        "Adresse",
        "Palette",
        "Page"
    ]);

    historiqueData.forEach((item) => {

        data.push([
            item.date || "",
            item.utilisateur || "",
            item.action || "",
            item.fichier || "",
            item.type || "",
            item.support || "",
            item.bt || "",
            item.adresse || "",
            item.palette || "",
            item.page || ""
        ]);
    });

    let worksheet =
        XLSX.utils.aoa_to_sheet(data);

    Object.keys(worksheet).forEach(cell => {

        if (cell[0] === "!") {
            return;
        }

        worksheet[cell].t = "s";
    });

    worksheet["!cols"] = [

        { wch: 22 },
        { wch: 18 },
        { wch: 35 },
        { wch: 28 },
        { wch: 15 },
        { wch: 24 },
        { wch: 24 },
        { wch: 20 },
        { wch: 14 },
        { wch: 30 }
    ];

    let workbook =
        XLSX.utils.book_new();

    XLSX.utils.book_append_sheet(
        workbook,
        worksheet,
        "Historique"
    );

    XLSX.writeFile(
        workbook,
        "Historique_AigleScan.xlsx"
    );
}


async function init() {

    let admin =
        await verifierAdmin();

    if (!admin) {
        return;
    }

    await chargerHistorique();
}

init();
window.filtrerHistorique = filtrerHistorique;
window.resetFiltres = resetFiltres;
window.exportHistoriqueExcel = exportHistoriqueExcel;
window.selectionnerToutesLesLignes = selectionnerToutesLesLignes;
window.mettreAJourSelectionGlobale = mettreAJourSelectionGlobale;
window.supprimerSelectionHistorique = supprimerSelectionHistorique;

</script>

<script type="module" src="maintenance.js"></script>

</body>
</html>
